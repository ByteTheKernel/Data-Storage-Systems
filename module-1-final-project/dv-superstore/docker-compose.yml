services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: dv_clickhouse
    ports:
      - "8123:8123"   # HTTP (встроенный Play UI: http://localhost:8123/play)
      - "9000:9000"   # native protocol (clickhouse-client)
    environment:
      CLICKHOUSE_DB: dv
      CLICKHOUSE_USER: dv_user
      CLICKHOUSE_PASSWORD: dv_pass
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      # CSV кладётся в ./data, внутри контейнера он виден функции file()
      - ./data:/var/lib/clickhouse/user_files
      - ch_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  ch_data:
